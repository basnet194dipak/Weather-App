<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="search">
        <h1>Weather App:</h1>
        <form action="">
            <label for="place">Search place:</label>
            <input type="text" id="place" name="place" placeholder="kathmandu">
            <input type="submit" name="" id="submit" value="Submit">
        </form>
    </div>
    <div class="result">
        <div class="change"><button>Fahrenheit/Celsius</button></div>
        <div class="output">
            <div class="today"></div>
            <div class="future"></div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
